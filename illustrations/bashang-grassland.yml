context: >-
  During a cold National Day holiday, the author joins a group tour to Fengning's Bashang Grassland and is swept into a four-hour first horseback ride, mixing dramatic autumn scenery with biting wind, physical soreness, extra cost, and dry humour. The existing riding photograph remains factual evidence.
